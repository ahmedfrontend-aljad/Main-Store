<button
  type="button"
  [disabled]="isOutOfStock()"
  (click)="addToCart()"
  class="w-full h-9 sm:h-10 md:h-12 px-2 sm:px-4 text-xs sm:text-sm md:text-base rounded-lg sm:rounded-xl font-medium transition-all duration-300 flex items-center justify-center gap-1.5 sm:gap-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-primary/50 disabled:cursor-not-allowed disabled:opacity-70 disabled:shadow-none"
  [ngClass]="{
    'bg-primary hover:bg-emerald-600 text-white shadow-emerald-200 dark:shadow-none':
      !isOutOfStock(),
    'bg-gray-100 dark:bg-gray-800 text-gray-400 dark:text-gray-500 border border-gray-200 dark:border-gray-700':
      isOutOfStock(),
  }"
>
  @if (!isOutOfStock()) {
    <i class="fa-solid fa-cart-shopping text-xs sm:text-sm md:text-base"></i>
    <span class="truncate">{{ "addtocart" | translate }}</span>
  } @else {
    <i
      class="fa-solid fa-ban text-xs sm:text-sm text-red-500 dark:text-red-400"
    ></i>
    <span class="text-[10px] sm:text-xs truncate">{{
      "notAvaliableRightNow" | translate
    }}</span>
  }
</button>
