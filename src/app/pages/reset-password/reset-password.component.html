<section class="login-section flex items-center justify-center">
  <div class="login-wrapper">
    <div class="login-card mx-auto">
      <h2
        class="login-title font-semibold font-serif text-center md:text-start"
      >
        {{ "resetPassword" | translate }}
      </h2>

      @if (resetForm) {
        <form
          class="login-form mt-4"
          [formGroup]="resetForm"
          (ngSubmit)="sendData()"
        >
          <div class="col-12">
            <app-store-input
              [label]="'username'"
              [placeholder]="'username'"
              [control]="resetForm.get('userName')!"
            >
            </app-store-input>
          </div>

          <div class="col-12 mt-3">
            <app-store-input
              [type]="'password'"
              [label]="'oldPassword'"
              [placeholder]="'oldPassword'"
              [control]="resetForm.get('oldPassword')!"
            >
            </app-store-input>
          </div>

          <div class="col-12 mt-3">
            <app-store-input
              [type]="'password'"
              [label]="'newPassword'"
              [placeholder]="'newPassword'"
              [control]="resetForm.get('newPassword')!"
            >
            </app-store-input>
          </div>

          <div class="col-12 mt-4">
            <app-submit-button
              [buttonText]="'restpassword'"
              [isDisabled]="resetForm.invalid"
            >
            </app-submit-button>
          </div>
        </form>
      }
    </div>
  </div>

  <div class="image">
    <img
      src="./assets/images/Background/password-reset-icon-flat-vector-design_116137-4571-Photoroom.png"
      alt="Auth Background"
      class="auth-img"
    />
  </div>
</section>
